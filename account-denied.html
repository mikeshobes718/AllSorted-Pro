<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access not approved — AllSorted Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;1,9..144,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth-ui.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --black: #0d0d0d;
    --white: #fafaf7;
    --cream: #f2efe8;
    --green: #1a3d2b;
    --green-light: #2d6648;
    --gold: #c9a84c;
    --muted: #6b6b5f;
    --border: rgba(13,13,13,0.12);
    --red: #8b2e2e;
  }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--black);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
    font-size: 15px;
    line-height: 1.55;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 2rem 1.75rem 1.75rem;
    box-shadow: 0 8px 32px rgba(13,13,13,0.06);
  }
  .logo {
    font-family: 'Fraunces', serif;
    font-size: 1.35rem;
    font-weight: 700;
    color: var(--green);
    text-align: center;
    margin-bottom: 0.35rem;
  }
  .logo span { color: var(--gold); }
  .sub {
    text-align: center;
    font-size: 0.9rem;
    color: var(--muted);
    margin-bottom: 1.25rem;
    font-weight: 300;
  }
  .sub strong { color: var(--red); }
  .btn {
    width: 100%;
    padding: 0.75rem 1rem;
    border: none;
    border-radius: 4px;
    font-size: 0.92rem;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    background: var(--green);
    color: var(--white);
    transition: background 0.15s;
    margin-top: 0.5rem;
  }
  .btn:hover { background: var(--green-light); }
  .back { text-align: center; margin-top: 1rem; }
  .back a { font-size: 0.85rem; color: var(--muted); text-decoration: none; }
  .back a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">AllSorted <span>Pro</span></div>
    <p class="sub">Your registration was <strong>not approved</strong> for portal access. If this is a mistake, contact your admin.</p>
    <button type="button" class="btn" onclick="signOutPortal()">Sign out</button>
    <div class="back"><a href="index.html">← Back to site</a></div>
  </div>
  <script src="auth.js"></script>
  <script>
    function signOutPortal() {
      logout();
      window.location.href = 'login.html';
    }
    seedUsersIfNeeded();
    (async function () {
      var u = getCurrentUser();
      if (!u) {
        window.location.replace('login.html');
        return;
      }
      if (u.role === 'admin') {
        window.location.replace('caller-dashboard.html');
        return;
      }
      var ok = await checkPortalAccessOrRedirect();
      if (ok) {
        window.location.replace('caller-dashboard.html');
      }
    })();
  </script>
</body>
</html>
